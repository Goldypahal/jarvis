name: python

on:
  push:
    paths:
      - "web/**"
      - "nexus/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "web/**"
      - "nexus/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/python.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        run: pytest -v tests
