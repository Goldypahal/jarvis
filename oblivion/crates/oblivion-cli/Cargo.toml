[package]
name = "oblivion-cli"
description = "Oblivion: a personal AI agent that runs on free model APIs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oblivion"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
tokio.workspace = true
chrono.workspace = true
oblivion-providers.workspace = true
oblivion-tools.workspace = true
oblivion-core.workspace = true
oblivion-store.workspace = true
oblivion-skills.workspace = true
oblivion-mcp.workspace = true
keyring = "4.2.0"
rpassword = "7.5.5"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
getrandom = "0.3"
rust-embed = "8.5"


[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true

# Turns on colour support in the classic Windows console.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
