[package]
name = "oblivion-mcp"
description = "MCP client for Oblivion: stdio and streamable-HTTP servers behind one compact `mcp` tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
tokio.workspace = true
oblivion-providers.workspace = true
oblivion-tools.workspace = true
rmcp = { version = "3.10.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }

[dev-dependencies]
tempfile.workspace = true
